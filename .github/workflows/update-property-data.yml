name: Update property data

on:
  schedule:
    - cron: "25 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: property-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check updater syntax
        run: node --check scripts/update-projects.mjs
      - name: Fetch URA project data
        run: npm run data:update-projects
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
      # New projects arrive without a footprint. Capturing it re-runs the
      # enrichment, so the 1km school figures stay per-address rather than
      # collapsing back to a single pin.
      - name: Capture address footprints
        run: npm run data:capture-footprints
      # Guards the freshly fetched data before it is committed: coordinates in
      # bounds, no mojibake, and no distances derived from fallback pins.
      - name: Validate data
        id: validate
        # `shell: bash` sets pipefail; without it `tee` would swallow a failing
        # exit code and let rejected data through.
        shell: bash
        run: npm test 2>&1 | tee /tmp/validate.log
      # Reading Actions logs needs a token, so when validation rejects a batch
      # publish the offending data and the failing assertions as artifacts —
      # otherwise the only signal is a red cross with no way to see why.
      - name: Publish rejected data
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-data
          path: |
            /tmp/validate.log
            public/data/projects.json
            public/data/project-audit.json
          retention-days: 14
      - name: Summarise failure
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          {
            echo "## 数据校验未通过，本次未提交"
            echo
            echo '```'
            grep -E "^(not ok|  +(error|expected|actual):)" /tmp/validate.log | head -40 || tail -40 /tmp/validate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production build
        run: npm run build
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/projects.json public/data/project-audit.json public/data/schools.json
          git diff --cached --quiet || git commit -m "Update URA property data"
          git push
